name: Deploy verified production build to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deployments must finish in order. Cancelling an upload midway can leave a
# half-published website at public_html.
concurrency:
  group: hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact committed version
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      # The site's build pre-renders pages for search engines, which requires Chromium.
      - name: Install the pre-rendering browser
        run: npx playwright install --with-deps chromium

      - name: Create the production build
        run: npm run build

      # This prevents the exact failure seen in production: uploading Vite source
      # whose entry point is /src/main.tsx instead of the generated /assets bundle.
      - name: Verify the upload is a compiled website
        run: |
          test -f dist/index.html
          test -d dist/assets
          ! grep -q '/src/main.tsx' dist/index.html
          grep -q '/assets/' dist/index.html

      - name: Install the secure SSH transfer helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass php-cli && php -l dist/api/form-submit.php

      # Hostinger's SSH service uses port 65002. First make an unauthenticated
      # handshake (password and interactive login are disabled), save the public
      # host key, and verify the hPanel fingerprint before sending credentials.
      # Hostinger stores this domain at domains/xingsalons.com/public_html under
      # the SSH home directory. The archive is unpacked beside public_html, then
      # published by an atomic directory rename—visitors never see a partly
      # copied bundle.
      - name: Replace Hostinger public_html with the verified build over SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_SMTP_PASSWORD: ${{ secrets.HOSTINGER_SMTP_PASSWORD }}
        run: |
          test -n "$HOSTINGER_SMTP_PASSWORD"
          install -m 700 -d ~/.ssh
          ssh -p 65002 -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=none -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o GSSAPIAuthentication=no "$HOSTINGER_USERNAME@$HOSTINGER_HOST" 'true' || true
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | grep -F 'SHA256:XQQLhQE5nX/8jCp35U3StskSjy+r4ncFsnJufIu6QII'
          tar -C dist -czf "$RUNNER_TEMP/xingsalons-build.tar.gz" .
          smtp_password_b64="$(printf %s "$HOSTINGER_SMTP_PASSWORD" | base64 -w0)"
          cat > "$RUNNER_TEMP/xingsalons-mail-config.php" <<EOF
          <?php
          return [
            'smtp_host' => 'smtp.hostinger.com',
            'smtp_port' => 465,
            'smtp_user' => 'appointments@xingsalons.com',
            'smtp_password_b64' => '$smtp_password_b64',
            'central_recipient' => 'appointments@xingsalons.com',
            'copy_recipient' => 'rachnasinha2020@gmail.com',
          ];
          EOF
          export SSHPASS="$HOSTINGER_PASSWORD"
          sshpass -e scp -P 65002 -o StrictHostKeyChecking=yes "$RUNNER_TEMP/xingsalons-build.tar.gz" "$HOSTINGER_USERNAME@$HOSTINGER_HOST:xingsalons-build.tar.gz"
          sshpass -e scp -P 65002 -o StrictHostKeyChecking=yes "$RUNNER_TEMP/xingsalons-mail-config.php" "$HOSTINGER_USERNAME@$HOSTINGER_HOST:xingsalons-mail-config.php"
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=yes "$HOSTINGER_USERNAME@$HOSTINGER_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -eu
          site_root="$HOME/domains/xingsalons.com"
          deploy_root="$site_root/public_html"
          staging_root="$site_root/.xingsalons-deploy-staging"
          backup_root="$site_root/.xingsalons-previous"
          archive="$HOME/xingsalons-build.tar.gz"
          mail_config="$HOME/xingsalons-mail-config.php"
          private_root="$site_root/.xing-private"

          test -d "$deploy_root"
          test -f "$mail_config"
          install -d -m 700 "$private_root"
          mv "$mail_config" "$private_root/mail.php"
          chmod 600 "$private_root/mail.php"
          rm -rf "$staging_root"
          mkdir "$staging_root"
          tar -xzf "$archive" -C "$staging_root"
          test -f "$staging_root/index.html"
          rm -rf "$backup_root"
          mv "$deploy_root" "$backup_root"
          if ! mv "$staging_root" "$deploy_root"; then
            mv "$backup_root" "$deploy_root"
            exit 1
          fi
          rm -rf "$backup_root" "$archive"
          REMOTE_SCRIPT

      - name: Verify the deployed homepage and legacy offer pages
        run: |
          for attempt in {1..12}; do
            homepage="$(curl --fail --silent --show-error https://xingsalons.com/ || true)"
            if [[ "$homepage" != *'/src/main.tsx'* && "$homepage" == *'/assets/index-'* ]]; then
              break
            fi
            sleep 10
          done
          [[ "$homepage" != *'/src/main.tsx'* ]]
          [[ "$homepage" == *'/assets/index-'* ]]
          for path in \
            /sarjapaurahaircoloroffers/ \
            /sarjapurahairtreatmentoffers/ \
            /sarjapuraskincareoffers/ \
            /hsrhaircoloroffers/ \
            /hsrhairtreatmentoffers/ \
            /hsrskincareoffers/; do
            curl --fail --silent --show-error "https://xingsalons.com$path" | grep -q 'data-site-header'
          done
