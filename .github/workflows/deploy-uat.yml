name: Deploy UAT build to Hostinger

on:
  # Kept as a manual emergency fallback only. Normal UAT releases are built
  # into the uat-static branch and pulled directly by Hostinger.
  workflow_dispatch:

# UAT lives inside production public_html/uat, so serialize it with the
# production release. This prevents either atomic directory swap from
# interrupting the other deployment.
concurrency:
  group: hostinger-site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact UAT version
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      # This opens a TLS login only; no email is sent during the check.
      - name: Verify Hostinger SMTP credentials
        env:
          HOSTINGER_SMTP_PASSWORD: ${{ secrets.HOSTINGER_SMTP_PASSWORD }}
        run: |
          test -n "$HOSTINGER_SMTP_PASSWORD"
          python3 - <<'PY'
          import os
          import smtplib
          import ssl

          with smtplib.SMTP_SSL('smtp.hostinger.com', 465, context=ssl.create_default_context(), timeout=20) as smtp:
              smtp.login('appointments@xingsalons.com', os.environ['HOSTINGER_SMTP_PASSWORD'])
          print('Hostinger SMTP authentication succeeded.')
          PY

      - name: Install the pre-rendering browser
        run: npx playwright install --with-deps chromium

      - name: Create the UAT build
        run: VITE_DEPLOY_ENV=uat npm run build && node scripts/mark-uat-build.mjs

      - name: Verify the UAT upload is a compiled noindex website
        run: |
          test -f dist/index.html
          test -d dist/assets
          ! grep -q '/src/main.tsx' dist/index.html
          grep -q 'noindex, nofollow' dist/index.html

      - name: Install secure transfer helpers
        run: sudo apt-get update && sudo apt-get install --yes lftp php-cli && php -l dist/api/form-submit.php

      - name: Replace only the UAT directory over FTPS
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_SMTP_PASSWORD: ${{ secrets.HOSTINGER_SMTP_PASSWORD }}
        run: |
          # UAT uses the account's encrypted FTPS service because password SSH transfers from GitHub are currently
          # timing out. This mirror is deliberately confined to the UAT document root; production is never named.
          # The mail configuration was installed outside public_html by the earlier successful UAT deployment and
          # is not touched here.
          # Hostinger uses explicit FTPS on port 21: plain FTP negotiation, immediately upgraded to TLS.
          # A full UAT release includes the image catalogue. Hostinger accepts the encrypted
          # connection but can transfer that catalogue slowly, so retain a firm 15-minute
          # ceiling rather than terminating an otherwise healthy upload after four minutes.
          timeout 900s lftp -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" "ftp://$HOSTINGER_HOST:21" -e '
            set cmd:fail-exit yes
            set net:max-retries 2
            set net:timeout 20
            set net:reconnect-interval-base 3
            set ftp:ssl-force true
            set ssl:verify-certificate yes
            mirror --reverse --delete --verbose dist domains/xingsalons.com/public_html/uat
            bye
          '

      - name: Verify the UAT deployment
        run: |
          for attempt in {1..12}; do
            homepage="$(curl --fail --silent --show-error https://uat.xingsalons.com/ || true)"
            if [[ "$homepage" == *'noindex, nofollow'* && "$homepage" == *'UAT — Test Environment'* ]]; then
              break
            fi
            sleep 10
          done
          [[ "$homepage" == *'noindex, nofollow'* ]]
          [[ "$homepage" == *'UAT — Test Environment'* ]]
